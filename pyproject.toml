[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: tests that require Docker Compose and external service startup",
]

[tool.coverage.run]
branch = true
source = ["apps"]

[tool.coverage.report]
show_missing = true
skip_covered = true
